#################### postgres + pgadmin ####################
services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: "no"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: p_admin
      POSTGRES_DB: my_postgres_db
    ports:
      - "127.0.0.1:5432:5432" # Allows your local Spring Boot app to connect
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-web
    restart: "no"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com  # Your login username for the web UI
      PGADMIN_DEFAULT_PASSWORD: admin        # Your login password for the web UI
    ports:
      - "127.0.0.1:5050:80"                  # Maps pgAdmin to http://localhost:5050
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  pgconsole:
    image: pgplex/pgconsole:latest
    container_name: pgconsole-web
    restart: "no"
    ports:
      - "127.0.0.1:9876:9876"
    volumes:
      - ./pgconsole.toml:/etc/pgconsole.toml:ro
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: