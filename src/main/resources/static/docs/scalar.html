<body>
<div id="app"></div>

<!-- Load the Script -->
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

<script type="module">
    const JwtPlugin = ({
                           loginEndpoint = "/api/v1/auth/login",
                           tokenField = "jwt",
                           storageKey = "jwt",
                       } = {}) => () => ({

        name: "jwt-auth-plugin",

        extensions: [],

        apiClientPlugins: [
            {
                hooks: {

                    beforeRequest({ requestBuilder }) {
                        // Tell Scalar to skip its default security handling
                        // requestBuilder.options.disableSecurity = true
                        console.log("🍃 Request Interceptor")
                        const token = localStorage.getItem(storageKey);

                        if (!token) return;

                        requestBuilder.headers.set(
                            "Authorization",
                            `Bearer ${token}`
                        );
                    },

                    async responseReceived({ response }) {
                        console.log("🍃 Response Interceptor")
                        try {
                            if (
                                !response.ok ||
                                !response.url.endsWith(loginEndpoint)
                            ) {
                                return;
                            }

                            const body = await response.clone().json();

                            const token = body[tokenField];

                            if (!token) return;

                            localStorage.setItem(storageKey, token);

                            console.log("JWT saved.");
                        } catch (err) {
                            console.error(err);
                        }
                    },
                },
            },
        ],
    });

    Scalar.createApiReference("#app", {
        url: "/docs/openapi.json",

        theme: "deepSpace",
        layout: "modern",

        // Hide MCP / Cursor code generation
        hideClientButton: true,
        defaultOpenFirstTag: false,

        persistAuth: true,

        plugins: [
            JwtPlugin(),
        ],
    });
</script>
</body>
</html>
